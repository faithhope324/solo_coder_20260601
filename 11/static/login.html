<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 秒杀系统</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700;900&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/auth.css">
</head>
<body>
    <div class="min-h-screen flex items-center justify-center" id="app">
        <div class="glow-bg"></div>
        <div class="login-card">
            <div class="login-header">
                <div class="logo-icon">⚡</div>
                <h1>秒杀系统</h1>
                <p>限时抢购 · 先到先得</p>
            </div>
            <div class="tab-switch">
                <button class="tab-btn active" data-tab="login">登录</button>
                <button class="tab-btn" data-tab="register">注册</button>
            </div>
            <form id="authForm">
                <div class="input-group">
                    <label>用户名</label>
                    <input type="text" id="username" placeholder="请输入用户名" required autocomplete="off">
                </div>
                <div class="input-group">
                    <label>密码</label>
                    <input type="password" id="password" placeholder="请输入密码" required>
                </div>
                <button type="submit" class="submit-btn" id="submitBtn">
                    <span class="btn-text">登 录</span>
                    <span class="btn-loading hidden">
                        <svg class="spinner" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3" fill="none" stroke-dasharray="31.4 31.4" stroke-linecap="round"/></svg>
                    </span>
                </button>
            </form>
            <div id="toast" class="toast hidden"></div>
        </div>
    </div>
    <script src="/static/js/auth.js"></script>
</body>
</html>

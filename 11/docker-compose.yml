version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: seckill
      POSTGRES_PASSWORD: seckill123
      POSTGRES_DB: seckill
    ports:
      - "5432:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://seckill:seckill123@postgres:5432/seckill
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: super-secret-key-change-in-production
    depends_on:
      - postgres
      - redis

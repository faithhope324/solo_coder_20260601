<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>在线抢答系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-indigo-600 via-purple-600 to-pink-500 flex items-center justify-center p-4">
    <div class="max-w-md w-full">
        <div class="bg-white/95 backdrop-blur-sm rounded-3xl shadow-2xl p-8">
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-16 h-16 bg-gradient-to-r from-indigo-500 to-purple-600 rounded-2xl mb-4">
                    <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                    </svg>
                </div>
                <h1 class="text-3xl font-bold text-gray-800 mb-2">在线抢答系统</h1>
                <p class="text-gray-500">实时抢答 · 公平公正 · 智能计分</p>
            </div>

            <div class="space-y-6">
                <div class="bg-gradient-to-r from-indigo-50 to-purple-50 rounded-2xl p-6">
                    <h3 class="font-semibold text-gray-800 mb-4 flex items-center">
                        <span class="w-8 h-8 bg-indigo-500 text-white rounded-lg flex items-center justify-center text-sm mr-3">1</span>
                        我是主持人
                    </h3>
                    <div class="space-y-3">
                        <input type="text" id="hostName" placeholder="输入您的昵称"
                            class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all">
                        <input type="text" id="roomName" placeholder="房间名称（可选）"
                            class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all">
                        <button onclick="createRoom()"
                            class="w-full py-3 bg-gradient-to-r from-indigo-500 to-purple-600 text-white rounded-xl font-semibold hover:from-indigo-600 hover:to-purple-700 transition-all transform hover:scale-[1.02] active:scale-[0.98] shadow-lg shadow-indigo-500/30">
                            创建房间
                        </button>
                    </div>
                </div>

                <div class="relative">
                    <div class="absolute inset-0 flex items-center">
                        <div class="w-full border-t border-gray-200"></div>
                    </div>
                    <div class="relative flex justify-center">
                        <span class="px-4 bg-white text-sm text-gray-400">或</span>
                    </div>
                </div>

                <div class="bg-gradient-to-r from-pink-50 to-rose-50 rounded-2xl p-6">
                    <h3 class="font-semibold text-gray-800 mb-4 flex items-center">
                        <span class="w-8 h-8 bg-pink-500 text-white rounded-lg flex items-center justify-center text-sm mr-3">2</span>
                        我是玩家
                    </h3>
                    <div class="space-y-3">
                        <input type="text" id="playerName" placeholder="输入您的昵称"
                            class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-pink-500 focus:border-transparent transition-all">
                        <input type="text" id="roomId" placeholder="输入房间号"
                            class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-pink-500 focus:border-transparent transition-all uppercase">
                        <button onclick="joinRoom()"
                            class="w-full py-3 bg-gradient-to-r from-pink-500 to-rose-600 text-white rounded-xl font-semibold hover:from-pink-600 hover:to-rose-700 transition-all transform hover:scale-[1.02] active:scale-[0.98] shadow-lg shadow-pink-500/30">
                            加入房间
                        </button>
                    </div>
                </div>
            </div>

            <div id="message" class="mt-6 text-center hidden">
                <div class="inline-flex items-center px-4 py-2 rounded-lg text-sm"></div>
            </div>
        </div>

        <p class="text-center text-white/60 text-sm mt-6">
            基于 Flask + Redis 构建 · 支持多人实时抢答
        </p>
    </div>

    <script>
        function showMessage(text, isError = false) {
            const msgDiv = document.getElementById('message');
            const innerDiv = msgDiv.querySelector('div');
            msgDiv.classList.remove('hidden');
            innerDiv.className = `inline-flex items-center px-4 py-2 rounded-lg text-sm ${isError ? 'bg-red-100 text-red-700' : 'bg-green-100 text-green-700'}`;
            innerDiv.textContent = text;
        }

        async function createRoom() {
            const hostName = document.getElementById('hostName').value.trim();
            const roomName = document.getElementById('roomName').value.trim();

            if (!hostName) {
                showMessage('请输入您的昵称', true);
                return;
            }

            try {
                const response = await fetch('/api/room', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ host_name: hostName, room_name: roomName })
                });

                const data = await response.json();
                if (data.success) {
                    const roomId = data.data.room_id;
                    localStorage.setItem(`host_${roomId}`, hostName);
                    window.location.href = `/host/${roomId}`;
                } else {
                    showMessage(data.message, true);
                }
            } catch (e) {
                showMessage('创建房间失败，请稍后重试', true);
            }
        }

        async function joinRoom() {
            const playerName = document.getElementById('playerName').value.trim();
            const roomId = document.getElementById('roomId').value.trim().toUpperCase();

            if (!playerName) {
                showMessage('请输入您的昵称', true);
                return;
            }
            if (!roomId) {
                showMessage('请输入房间号', true);
                return;
            }

            try {
                const response = await fetch(`/api/room/${roomId}/join`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ player_name: playerName })
                });

                const data = await response.json();
                if (data.success) {
                    localStorage.setItem(`player_${roomId}`, JSON.stringify({
                        player_id: data.data.player_id,
                        player_name: data.data.player_name
                    }));
                    window.location.href = `/player/${roomId}`;
                } else {
                    showMessage(data.message, true);
                }
            } catch (e) {
                showMessage('加入房间失败，请检查房间号是否正确', true);
            }
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>test - 搜索结果 - 文档搜索引擎</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/static/css/style.css">
    
<style>
em.highlight {
    background-color: #fff3cd;
    color: #d63384;
    font-style: normal;
    font-weight: bold;
    padding: 0 2px;
    border-radius: 2px;
}
.badge.bg-txt { background-color: #6c757d !important; }
.badge.bg-pdf { background-color: #dc3545 !important; }
.badge.bg-doc, .badge.bg-docx { background-color: #0d6efd !important; }
</style>

</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="bi bi-search-heart"></i> 文档搜索引擎
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/">
                            <i class="bi bi-house"></i> 首页
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/search/">
                            <i class="bi bi-search"></i> 搜索
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/upload/">
                            <i class="bi bi-cloud-upload"></i> 上传文档
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/documents/">
                            <i class="bi bi-folder2-open"></i> 文档管理
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container mt-4">
        
        
<div class="row mb-4">
    <div class="col-12">
        <form action="/search/" method="get" class="d-flex gap-2">
            <div class="input-group input-group-lg flex-grow-1">
                <input type="text" name="q" class="form-control" value="test"
                       placeholder="输入关键词搜索文档..." aria-label="搜索" id="searchInput">
                <button class="btn btn-primary" type="submit">
                    <i class="bi bi-search"></i> 搜索
                </button>
                
                    <a href="/search/" class="btn btn-outline-secondary" title="清除">
                        <i class="bi bi-x-lg"></i>
                    </a>
                
            </div>
        </form>
    </div>
</div>

<div class="row">
    <div class="col-md-3">
        <div class="card border-0 shadow-sm mb-4">
            <div class="card-header bg-white">
                <h6 class="mb-0"><i class="bi bi-fire"></i> 热门搜索</h6>
            </div>
            <div class="card-body">
                
                    
                        <a href="/search/?q=test"
                           class="badge bg-primary text-decoration-none me-1 mb-2">
                            test
                            <span class="badge bg-white text-dark ms-1">4</span>
                        </a>
                    
                
            </div>
        </div>

        <div class="card border-0 shadow-sm">
            <div class="card-header bg-white">
                <h6 class="mb-0"><i class="bi bi-clock-history"></i> 搜索历史</h6>
            </div>
            <div class="card-body">
                
                    <div class="list-group list-group-flush">
                        
                            <a href="/search/?q=test"
                               class="list-group-item list-group-item-action border-0 px-0 py-2 small">
                                <i class="bi bi-search text-muted me-1"></i>test
                            </a>
                        
                    </div>
                
            </div>
        </div>
    </div>

    <div class="col-md-9">
        
            <div class="alert alert-danger">
                <i class="bi bi-exclamation-triangle"></i> 搜索出错: URL must include a &#x27;scheme&#x27;, &#x27;host&#x27;, and &#x27;port&#x27; component (ie &#x27;https://localhost:9200&#x27;)
            </div>
        

        
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h5 class="mb-0">
                    搜索 "<strong class="text-primary">test</strong>"
                    <small class="text-muted ms-2">共找到 0 条结果</small>
                </h5>
                
            </div>

            
                <div class="text-center py-5">
                    <div class="display-1 text-muted mb-3"><i class="bi bi-search-x"></i></div>
                    <h4 class="text-muted">没有找到相关文档</h4>
                    <p class="text-muted">试试其他关键词，或者<a href="/upload/">上传更多文档</a></p>
                </div>
            
        
    </div>
</div>

    </main>

    <footer class="footer mt-5 py-3 bg-light">
        <div class="container text-center text-muted">
            <small>&copy; 2024 文档搜索引擎 - Django + Elasticsearch</small>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
<script>
const input = document.getElementById('searchInput');
input.focus();
input.setSelectionRange(input.value.length, input.value.length);
</script>

</body>
</html>
